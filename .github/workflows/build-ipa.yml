name: Build TG IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Show runner info
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          df -h /
          sysctl hw.memsize

      - name: Free disk (keep newest Xcode only)
        run: |
          export KEEP=$(python3 -c "import glob;print(max(glob.glob('/Applications/Xcode*.app'),key=lambda p:[int(x) for x in __import__('re').findall(r'\d+',p)]))")
          echo "Keeping $KEEP"
          sudo python3 -c "import glob,shutil,os;keep=os.environ['KEEP'];[shutil.rmtree(x) for x in glob.glob('/Applications/Xcode*.app') if x!=keep]"
          sudo xcode-select -s "$KEEP"
          xcodebuild -version
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-macos-arm64-${{ github.sha }}
          restore-keys: bazel-macos-arm64-

      - name: Cap build concurrency for 7GB runner
        run: |
          echo "startup --host_jvm_args=-Xmx1g" >> .bazelrc
          echo "build --jobs=3" >> .bazelrc

      - name: Build release_arm64 (fake codesigning)
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/myfork-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64 \
            --overrideXcodeVersion

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error
