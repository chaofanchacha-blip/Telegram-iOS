name: Build TG IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Show runner info
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          df -h /
          sysctl hw.memsize

      - name: Free disk (keep newest Xcode only)
        run: |
          KEEP=$(python3 -c "import glob,os,re;print(os.path.realpath(max(glob.glob('/Applications/Xcode*.app'),key=lambda p:[int(x) for x in re.findall(r'\d+',p)])))")
          echo "Keeping $KEEP"
          sudo python3 -c "import glob,shutil,os,sys;keep=sys.argv[1];[os.remove(x) if os.path.islink(x) else shutil.rmtree(x) for x in glob.glob('/Applications/Xcode*.app') if os.path.realpath(x)!=keep]" "$KEEP"
          sudo xcode-select -s "$KEEP"
          xcodebuild -version
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bazel cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-macos-arm64-${{ github.sha }}
          restore-keys: bazel-macos-arm64-

      - name: Cap build concurrency for 7GB runner
        run: |
          echo "startup --host_jvm_args=-Xmx1g" >> .bazelrc
          echo "build --jobs=3" >> .bazelrc

      - name: Configure Bazel remote cache (persistent, on our own VPS)
        if: env.POR_BAZEL_REMOTE != ''
        run: |
          CACHE_HOST=$(echo "$POR_BAZEL_REMOTE" | sed -E 's#.*@([^/:]+):([0-9]+).*#\1#')
          CACHE_PORT=$(echo "$POR_BAZEL_REMOTE" | sed -E 's#.*@([^/:]+):([0-9]+).*#\2#')
          if nc -z -w 5 "$CACHE_HOST" "$CACHE_PORT" 2>/dev/null; then
            echo "BR cache reachable at $CACHE_HOST:$CACHE_PORT, enabling remote cache"
            echo "build --remote_cache=$POR_BAZEL_REMOTE" >> .bazelrc
            echo "build --remote_upload_local_results=true" >> .bazelrc
          else
            echo "BR cache unreachable at $CACHE_HOST:$CACHE_PORT, skipping remote cache (GHA cache fallback)"
          fi
        env:
          POR_BAZEL_REMOTE: ${{ secrets.POR_BAZEL_REMOTE }}

      - name: Build release_arm64 (fake codesigning)
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/myfork-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Collect IPA
        run: |
          mkdir -p build/artifacts
          cp bazel-bin/Telegram/Telegram.ipa build/artifacts/Telegram.ipa
          ls -lh build/artifacts/

      - name: Bazel cache (save even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error
